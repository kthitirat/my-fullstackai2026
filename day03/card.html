    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Card</title>
    <style>
        *{
            font-family: "Prompt", sans-serif;
        }
        .card {
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
            /* box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); */
            margin: 20px;
            background-color: #f9f9f9;
            float: left;
            flex-direction: column;            
        }
        .card-body {
            background-color: rgb(245, 246, 246);
        }
        .card-img {

        }
        card-action {
           text-align: center;
             display: inline-block;
        }
        button {
          font-size: 20px;
          margin: 10px;
        }
         
        .card-1 {
            width: 250px;           
            border-radius: 5px;           
            margin: 20px;           
            float: left;
            flex-direction: column;
            
        }
        .card-description {
            font-size: 20px;
            color: rgb(139, 139, 141);
            /* padding: 10px; */
            background-color: #f9f9f9;
        }
        h2 {
            color: rgb(30, 3, 138);
            
            font-size: 24px;
            margin: 0;
            padding: 10px; 
        }
        h3 {
            color: rgb(30, 3, 138);           
            font-size: 24px;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .text {
            font-size: 18px;
            color: #555;
            padding: 10px;   
            white-space: wrap;         
        }
        .card-image {
            width: 100%;
            height: auto;           
        }
        .card-image1 {
            width: 100%;
            height: auto;
            border-radius: 5px 5px 0 0;
        }

        .label {
            padding: 6px 14px;
            border-radius: 8px;
            background-color:aquamarine
        }

    </style>
</head>
<body>

    <div class ="card">
        <img src="./images/pic-unsplash.jpg" alt="Card Image" class="card-image">
        <div class="card-body">
            <h2>My Personal Card</h2>
            <p class="text">ยกตัวอย่างเว็บไซต์ส่วนตัวที่สร้างเป็นธุรกิจได้อย่าง Neilpatel ที่เป็นนักการตลาดออนไลน์ที่มีผู้ติดตามจากทั่วโลก และเป็นคนสร้างเครื่องมือด้าน SEO อย่าง Ubersuggest </p>
            <button class="label">Action</button>
        </div>
       


    </div>
