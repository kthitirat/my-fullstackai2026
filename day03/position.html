<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Position</h1>
    <div style="position: relative;">       
        <img src="https://images.unsplash.com/photo-1789758385758-a18794e41c05?q=80&w=1400&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDE%3D" alt="Image" style="position: absolute; right: 50px; right: 50px; width: 100%;">
        <h2 style="color: rgb(225, 5, 5); position: absolute; bottom: 20px; right: 20px;">This is a heading</h2>
        <h2 style="color: rgb(4, 143, 94); position: relative; top: 50px; left: 50px; right: 50px;">This is a heading</h2>
    </div>
</body>
</html>
